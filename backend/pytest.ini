[pytest]
pythonpath = .
testpaths = tests
# lives outside the home folder (it appears in fixture reprs on failure).
addopts = --no-header --basetemp=/tmp/orderflow-pytest
markers =
    known_bug(bug_id): test that exposes an intentionally injected defect and is expected to FAIL until fixed
    perf: performance / concurrency measurement test
filterwarnings =
    ignore:.*Decimal objects natively.*
    ignore:Using `httpx` with `starlette.testclient` is deprecated
